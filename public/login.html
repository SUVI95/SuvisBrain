<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knuut — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-500: #422AFB;
      --brand-600: #3311DB;
      --brand-tint: #E9E3FF;
      --secondary-300: #F4F7FE;
      --secondary-400: #E9EDF7;
      --secondary-500: #8F9BBA;
      --secondary-900: #1B2559;
      --card-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.08);
      --font: 'DM Sans', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--secondary-300);
      color: var(--secondary-900);
      min-height: 100vh;
      display: flex;
      letter-spacing: -0.5px;
    }
    @keyframes slideDown {
      from { transform: translateY(-40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .split-left {
      flex: 1;
      background: linear-gradient(160deg, var(--brand-500) 0%, var(--brand-600) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      min-height: 100vh;
      box-shadow: 4px 0 24px rgba(66, 42, 251, 0.12);
    }
    .logo-area {
      animation: slideDown 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .logo-name {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
    }
    .tagline { font-size: 18px; color: rgba(255,255,255,0.85); margin-top: 12px; font-weight: 500; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .split-left { min-height: 200px; padding: 24px; }
      .logo-name { font-size: 32px; }
      .tagline { font-size: 14px; }
    }
    .split-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .form-card {
      background: #FFFFFF;
      box-shadow: var(--card-shadow);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.4s ease 0.1s both;
      border: none;
    }
    .form-card.shake { animation: shake 0.4s ease; }
    .tabs {
      display: flex;
      background: var(--secondary-300);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
      border: 1px solid var(--secondary-400);
    }
    .tabs .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--secondary-500);
      cursor: pointer;
      transition: 0.2s ease;
      font-family: inherit;
      z-index: 1;
    }
    .tabs .tab.active { color: #fff; }
    .tabs .slide {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: var(--brand-500);
      border-radius: 12px;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 8px rgba(66, 42, 251, 0.25);
    }
    .tabs .slide.teacher { transform: translateX(100%); }
    label { display: block; font-size: 14px; font-weight: 600; color: var(--secondary-900); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--secondary-400);
      border-radius: 16px;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: var(--secondary-900);
    }
    input:focus {
      outline: none;
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px var(--brand-tint);
    }
    .btn-primary {
      width: 100%;
      padding: 14px 28px;
      background: var(--brand-500);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.12);
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); background: var(--brand-600); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-primary.loading { position: relative; color: transparent; }
    .btn-primary.loading::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      left: 50%;
      top: 50%;
      margin: -12px 0 0 -12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary.success::before {
      content: '✓';
      position: absolute;
      color: #fff;
      font-size: 24px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .error { color: #EE5D50; font-size: 13px; margin-top: 12px; font-weight: 600; }
    .hint { font-size: 12px; color: var(--secondary-500); margin-top: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="split-left">
    <div class="logo-area">
      <div class="logo-name">Knuut</div>
      <p class="tagline">Learn Finnish. Remember everything.</p>
    </div>
  </div>
  <div class="split-right">
    <div class="form-card" id="form-card">
      <div class="tabs">
        <div class="slide" id="tab-slide"></div>
        <button type="button" class="tab active" data-role="learner">Learner</button>
        <button type="button" class="tab" data-role="teacher">Teacher</button>
      </div>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required autofocus>
        <div id="password-wrap" style="display:none">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password">
        </div>
        <button type="submit" class="btn-primary" id="btn">Sign in</button>
      </form>
      <div class="error" id="error"></div>
      <p class="hint">Learners: email only. Teachers: teacher@knuut.fi + password (run: npm run set-teacher-password)</p>
    </div>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn');
    const err = document.getElementById('error');
    const card = document.getElementById('form-card');

    const pwWrap = document.getElementById('password-wrap');
    const isTeacher = () => document.querySelector('.tab.active').dataset.role === 'teacher';

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-slide').classList.toggle('teacher', tab.dataset.role === 'teacher');
        pwWrap.style.display = tab.dataset.role === 'teacher' ? 'block' : 'none';
        document.getElementById('password').required = tab.dataset.role === 'teacher';
        err.textContent = '';
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      card.classList.remove('shake');
      btn.disabled = true;
      btn.classList.add('loading');
      btn.classList.remove('success');
      const email = form.email.value.trim();
      const password = (form.password && form.password.value) || '';
      const payload = isTeacher() ? { email, password } : { email };
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        let data;
        try { data = await res.json(); } catch (_) { data = { error: res.status === 404 ? 'API not found — check deployment' : 'Server error' }; }
        if (!res.ok) {
          err.textContent = data.error || 'Login failed';
          btn.disabled = false;
          btn.classList.remove('loading');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 400);
          return;
        }
        localStorage.setItem('sb_token', data.token);
        localStorage.setItem('sb_user', JSON.stringify({ ...data.user, role: data.role }));
        localStorage.setItem('knuut_token', data.token);
        localStorage.setItem('knuut_user', JSON.stringify({ ...data.user, role: data.role }));
        btn.classList.remove('loading');
        btn.classList.add('success');
        const next = new URLSearchParams(location.search).get('next') || (data.role === 'teacher' ? '/teacher-dashboard.html' : '/oppipolku.html');
        setTimeout(() => { location.href = next; }, 600);
      } catch (e) {
        err.textContent = 'Network error';
        btn.disabled = false;
        btn.classList.remove('loading');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);
      }
    });
  </script>
</body>
</html>
