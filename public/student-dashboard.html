<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knuut — Oppipolku</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F4F7FA; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    p { font-size: 16px; }
  </style>
  <script>
(function () {
  var token = localStorage.getItem('sb_token') || localStorage.getItem('knuut_token');
  var user = null;
  try { user = JSON.parse(localStorage.getItem('sb_user') || localStorage.getItem('knuut_user') || 'null'); } catch (e) {}
  if (!token || user?.role !== 'learner') {
    location.replace('/login.html?next=' + encodeURIComponent('/oppipolku.html'));
    return;
  }
  location.replace('/oppipolku.html');
})();
  </script>
</head>
<body>
  <p>Ohjataan Oppipolkuun…</p>
</body>
</html>
