<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knuut AI — Language Teacher</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/shepherd.css">
  <style>
    :root {
      --brand-400: #7551FF;
      --brand-500: #422AFB;
      --brand-600: #3311DB;
      --brand-tint: #E9E3FF;
      --brand-soft: #F2EFFF;
      --secondary-300: #F4F7FE;
      --secondary-400: #E9EDF7;
      --secondary-500: #8F9BBA;
      --secondary-900: #1B2559;
      --green-500: #01B574;
      --orange-100: #FFF6DA;
      --card-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.08);
      --btn-shadow: 45px 76px 113px 7px rgba(112, 144, 176, 0.08);
      --font: 'DM Sans', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--secondary-300);
      color: var(--secondary-900);
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.3s;
      letter-spacing: -0.5px;
    }
    body.yki-mode { background: var(--orange-100); color: var(--secondary-900); }
    body.yki-mode .nav-link, body.yki-mode .subtitle { color: var(--secondary-500); }
    body.yki-mode .nav-link:hover { color: var(--brand-500); }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .orb-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .content-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      max-width: 800px;
    }
    .nav-row {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 20;
      justify-content: flex-start;
    }
    .nav-link {
      padding: 8px 16px;
      border-radius: 16px;
      border: none;
      background: #fff;
      color: var(--secondary-500);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: var(--card-shadow);
    }
    .nav-link:hover {
      background: var(--brand-soft);
      color: var(--brand-500);
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-400) 50%, var(--green-500) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .subtitle {
      font-size: 1.1rem;
      color: var(--secondary-500);
      margin-bottom: 2.5rem;
      line-height: 1.6;
      font-weight: 500;
    }
    .talk-button {
      padding: 18px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      background: var(--brand-500);
      color: #fff;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--btn-shadow);
      font-family: inherit;
      z-index: 20;
    }
    .talk-button:hover {
      transform: translateY(-2px);
      background: var(--brand-600);
      box-shadow: 14px 17px 48px 4px rgba(112, 144, 176, 0.14);
    }
    .talk-button.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 32px rgba(239,68,68,0.4);
    }
    .talk-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #voice-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin: 2rem 0;
      height: 50px;
    }
    .vb {
      width: 5px;
      height: 18px;
      background: var(--brand-500);
      border-radius: 3px;
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .status-text {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--secondary-500);
      min-height: 24px;
    }
    .status-text.active {
      color: var(--green-500);
      font-weight: 600;
    }
    .mode-tabs {
      display: flex;
      gap: 4px;
      background: #fff;
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--secondary-400);
    }
    body.yki-mode .mode-tabs { background: #fff; }
    .mode-tab {
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: var(--secondary-500);
      font-family: inherit;
    }
    body.yki-mode .mode-tab { color: var(--secondary-500); }
    .mode-tab.active {
      background: var(--brand-500);
      color: #fff;
      box-shadow: var(--btn-shadow);
    }
    body.yki-mode .mode-tab.active { background: var(--brand-500); color: #fff; }
    .mode-tab:not(.active):hover { color: var(--brand-500); }
    body.yki-mode .mode-tab:not(.active):hover { color: var(--brand-600); }
    .yki-banner {
      display: none;
      background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-400) 100%);
      color: #fff;
      padding: 12px 24px;
      border-radius: 16px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: var(--card-shadow);
    }
    .yki-banner.visible { display: flex; flex-wrap: wrap; }
    .yki-banner .timer { font-size: 20px; font-weight: bold; }
    .yki-banner .timer.warn { color: #FF4B4B; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .session-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .session-overlay.visible { display: flex; }
    .overlay-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      text-align: center;
      box-shadow: var(--card-shadow);
      border: none;
    }
    .overlay-card h2 { font-size: 22px; margin-bottom: 8px; color: var(--secondary-900); font-family: var(--font); font-weight: 800; }
    .overlay-card .badge { font-size: 32px; font-weight: bold; color: var(--brand-500); margin: 16px 0; }
    .overlay-check {
      width: 80px; height: 80px; margin: 0 auto 20px;
    }
    .overlay-check circle, .overlay-check path {
      fill: none; stroke: var(--green-500); stroke-width: 3;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .overlay-check circle { stroke-dasharray: 283; stroke-dashoffset: 283; animation: drawCircle 0.6s ease forwards; }
    .overlay-check path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawCheck 0.4s ease 0.5s forwards; }
    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }
    .overlay-stats { display: flex; gap: 20px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
    .overlay-stat { font-size: 14px; color: var(--secondary-500); }
    .overlay-summary { font-style: italic; color: var(--secondary-500); font-size: 14px; max-width: 360px; margin: 0 auto 24px; line-height: 1.5; }
    .overlay-card .btn {
      display: inline-block;
      padding: 14px 28px;
      margin: 8px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
      box-shadow: var(--btn-shadow);
      transition: transform 0.15s, background 0.2s;
    }
    .overlay-card .btn:hover { transform: translateY(-2px); }
    .overlay-card .btn:active { transform: translateY(0); }
    .overlay-card .btn-primary { background: var(--brand-500); color: #fff; }
    .overlay-card .btn-primary:hover { background: var(--brand-600); }
    .overlay-card .btn-success { background: var(--green-500); color: #fff; }
    .learning-card {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 320px;
      max-width: calc(100vw - 48px);
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 20px;
      z-index: 1000;
      border: none;
      animation: cardSlide 0.3s ease;
    }
    body.yki-mode .learning-card { box-shadow: var(--card-shadow); }
    @keyframes cardSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .learning-card h3 { font-size: 14px; color: var(--secondary-500); margin-bottom: 8px; font-weight: 600; }
    .learning-card .card-word { font-size: 22px; font-weight: 700; color: var(--secondary-900); margin-bottom: 8px; }
    .learning-card .card-hint { font-size: 13px; color: var(--secondary-500); margin-bottom: 12px; }
    .learning-card .card-hint-wrap { margin-bottom: 8px; }
    .learning-card input {
      width: 100%;
      border: 1px solid var(--secondary-400);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 12px;
      font-family: inherit;
      color: var(--secondary-900);
    }
    .learning-card input:focus { outline: none; border-color: var(--brand-500); box-shadow: 0 0 0 2px var(--brand-tint); }
    .learning-card .card-actions { display: flex; gap: 8px; }
    .learning-card button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .learning-card .btn-save { background: var(--brand-500); color: #fff; box-shadow: var(--btn-shadow); }
    .learning-card .btn-save:hover { background: var(--brand-600); }
    .learning-card .btn-close { background: var(--secondary-300); color: var(--secondary-900); }
    .learning-card .btn-save:hover { opacity: 0.9; }
    .learning-card .btn-close:hover { background: #e5e7eb; }
    .learning-card.feedback-correct input { border-color: #22c55e; }
    .learning-card.feedback-wrong input { border-color: #ef4444; }
    .learning-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .learning-card .btn-repeat {
      padding: 6px 10px;
      font-size: 12px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-tint);
      border-radius: 10px;
      color: var(--brand-500);
      cursor: pointer;
      font-family: inherit;
    }
    .learning-card .btn-repeat:hover { background: var(--brand-tint); }
    .learning-card .btn-reveal {
      padding: 6px 12px;
      font-size: 12px;
      background: transparent;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      color: #6B7280;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 8px;
    }
    .learning-card .btn-reveal:hover { background: #f3f4f6; }
    .learning-card .card-feedback { margin-bottom: 10px; font-size: 14px; }
    .learning-card .card-feedback.feedback-correct { color: #22c55e; font-weight: 600; }
    .learning-card .card-feedback.feedback-wrong { color: #6B7280; }
    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; }
      .subtitle { font-size: 0.95rem; }
      .talk-button { padding: 14px 28px; font-size: 1.1rem; }
      .learning-card { right: 16px; bottom: 16px; width: calc(100vw - 32px); }
    }

    /* Text chat fallback (when /api/session fails) — voice flow unchanged when session works */
    body.knuut-text-fallback #orb-root { opacity: 0 !important; pointer-events: none; }
    .orb-static-fallback {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(48vw, 260px);
      height: min(48vw, 260px);
      border-radius: 50%;
      z-index: 1;
      background: radial-gradient(circle at 38% 32%, rgba(66, 42, 251, 0.45), rgba(1, 181, 116, 0.35) 52%, rgba(244, 247, 254, 0.9) 100%);
      box-shadow: 0 0 60px rgba(66, 42, 251, 0.2), inset 0 0 40px rgba(255,255,255,0.5);
    }
    body.knuut-text-fallback .orb-static-fallback { display: block; }
    .text-fallback-banner {
      display: none;
      max-width: 520px;
      margin: 0 auto 12px;
      padding: 10px 16px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--secondary-900);
      background: var(--brand-soft);
      border: 1px solid var(--brand-tint);
      border-radius: 16px;
      font-weight: 500;
    }
    body.knuut-text-fallback .text-fallback-banner { display: block; }
    .text-fallback-chat {
      display: none;
      width: 100%;
      max-width: 520px;
      max-height: min(38vh, 320px);
      overflow-y: auto;
      margin: 8px auto 12px;
      padding: 8px 4px;
      text-align: left;
      font-family: var(--font);
    }
    body.knuut-text-fallback .text-fallback-chat { display: block; }
    .chat-bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 16px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .chat-bubble.user {
      margin-left: auto;
      background: var(--brand-soft);
      color: var(--secondary-900);
      border: 1px solid var(--brand-tint);
      border-bottom-right-radius: 4px;
      font-weight: 600;
    }
    .chat-bubble.knuut {
      margin-right: auto;
      background: #fff;
      color: var(--secondary-900);
      border-bottom-left-radius: 4px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--secondary-400);
    }
    .text-fallback-input-row {
      display: none;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      gap: 8px;
      align-items: stretch;
      font-family: var(--font);
    }
    body.knuut-text-fallback .text-fallback-input-row { display: flex; }
    .text-fallback-input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--secondary-400);
      background: #fff;
      color: var(--secondary-900);
      font-size: 15px;
    }
    .text-fallback-input-row input::placeholder { color: var(--secondary-500); }
    .text-fallback-input-row input:focus {
      outline: none;
      border-color: var(--brand-500);
      box-shadow: 0 0 0 2px var(--brand-tint);
    }
    .text-fallback-input-row button {
      padding: 12px 20px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      background: var(--brand-500);
      color: #fff;
      font-family: inherit;
      box-shadow: var(--btn-shadow);
    }
    .text-fallback-input-row button:hover { background: var(--brand-600); }
    .text-fallback-input-row button:disabled { opacity: 0.6; cursor: not-allowed; }
    body.knuut-text-fallback .content-overlay {
      justify-content: flex-start;
      padding-top: 72px;
      overflow-y: auto;
      max-height: 100vh;
    }
    body.knuut-text-fallback h1,
    body.knuut-text-fallback .subtitle { display: none; }
    .panic-btn {
      display: none;
      margin-top: 14px;
      padding: 14px 22px;
      border-radius: 16px;
      border: 2px solid #f59e0b;
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      color: #92400e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: var(--card-shadow);
      max-width: 92vw;
    }
    .panic-btn:hover { filter: brightness(0.98); }
    .oph-hint {
      font-size: 13px;
      color: var(--secondary-500);
      margin: 10px auto 0;
      max-width: 520px;
      line-height: 1.5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-row">
      <a href="oppipolku.html" class="nav-link">Oppipolku</a>
      <a href="privacy-ai.html" class="nav-link">Privacy &amp; AI</a>
      <a href="#" id="knuut-logout" class="nav-link">Log out</a>
    </div>
    <div class="orb-container">
      <div class="orb-static-fallback" aria-hidden="true"></div>
      <div id="orb-root"></div>
    </div>
    <div class="content-overlay">
      <div class="text-fallback-banner" id="text-fallback-banner">
        💬 Tekstiharjoittelu — paina mikrofoni-ikonia äänikeskustelua varten
      </div>
      <div class="text-fallback-chat" id="text-fallback-chat"></div>
      <h1>KNUUT AI</h1>
      <p class="subtitle">Your voice teacher — speak any language. Practice with Knuut and get gentle corrections in real time.</p>
      <div id="voice-bars">
        <div class="vb"></div><div class="vb"></div><div class="vb"></div><div class="vb"></div>
        <div class="vb"></div><div class="vb"></div><div class="vb"></div><div class="vb"></div>
        <div class="vb"></div><div class="vb"></div><div class="vb"></div><div class="vb"></div>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="free">Free practice</button>
        <button class="mode-tab" data-mode="yki">YKI exam mode</button>
      </div>
      <div class="yki-banner" id="yki-banner">
        <span>YKI Exam Mode — B1 level</span>
        <span class="timer" id="yki-timer">15:00</span>
      </div>
      <p class="oph-hint" id="oph-context-hint" style="display:none"></p>
      <button id="knuut-talk-btn" class="talk-button">Talk with Knuut</button>
      <button type="button" id="knuut-panic-btn" class="panic-btn" aria-label="Help in my language">🆘 Hätäapu — selitä omalla kielellä / Help in my language</button>
      <div id="status-text" class="status-text"></div>
      <div class="text-fallback-input-row" id="text-fallback-input-row">
        <input type="text" id="text-fallback-input" placeholder="Kirjoita suomeksi..." autocomplete="off" />
        <button type="button" id="text-fallback-send">Lähetä</button>
      </div>
    </div>
  </div>

  <div id="learning-cards-container"></div>

  <div class="session-overlay" id="session-overlay">
    <div class="overlay-card">
      <svg class="overlay-check" viewBox="0 0 80 80" id="overlay-check">
        <circle cx="40" cy="40" r="36"/>
        <path d="M22 40 L35 53 L58 27"/>
      </svg>
      <h2 id="overlay-title">Session complete!</h2>
      <div class="overlay-stats" id="overlay-stats"></div>
      <p class="overlay-summary" id="overlay-summary"></p>
      <div id="overlay-buttons"></div>
    </div>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    (function(){
      const btn = document.getElementById('knuut-talk-btn');
      const statusText = document.getElementById('status-text');
      if (!btn) return;

      const token = localStorage.getItem('sb_token') || localStorage.getItem('knuut_token');
      const user = (() => { try { return JSON.parse(localStorage.getItem('sb_user') || localStorage.getItem('knuut_user') || '{}'); } catch { return {}; } })();
      if (!token) {
        location.replace('/login.html?next=' + encodeURIComponent('/knuut.html' + location.search));
        return;
      }
      document.getElementById('knuut-logout')?.addEventListener('click', function (e) {
        e.preventDefault();
        ['knuut_token', 'knuut_user', 'sb_token', 'sb_user'].forEach(function (k) { localStorage.removeItem(k); });
        location.replace('/login.html');
      });
      const params = new URLSearchParams(location.search);
      const urlLearnerId = params.get('learner_id');
      const learnerId = urlLearnerId || (user?.role === 'learner' ? user?.id : null);
      const dashboardMode = params.get('mode') || null;
      const topicParam = params.get('topic') || null;
      const ophModuleParam = params.get('oph_module') || params.get('module') || null;
      const workplacePrepParam = params.get('workplace_prep') || params.get('workplace') || null;
      (function () {
        var hint = document.getElementById('oph-context-hint');
        if (!hint) return;
        var parts = [];
        if (ophModuleParam) parts.push('OPH-moduuli / module: ' + ophModuleParam);
        if (workplacePrepParam) parts.push('Työpaikkaharjoittelu / workplace: ' + workplacePrepParam);
        if (topicParam && (ophModuleParam || workplacePrepParam)) {
          try { parts.push(decodeURIComponent(topicParam)); } catch (e) { parts.push(topicParam); }
        }
        if (parts.length) {
          hint.style.display = 'block';
          hint.textContent = parts.join(' · ');
        }
      })();
      let reviewWords = [];
      if (dashboardMode === 'review') {
        const reviewWordsParam = params.get('review_words');
        const wordsParam = params.get('words');
        try {
          if (reviewWordsParam) reviewWords = JSON.parse(decodeURIComponent(reviewWordsParam));
          else if (wordsParam) reviewWords = decodeURIComponent(wordsParam).split(',').map(w => w.trim()).filter(Boolean);
          else reviewWords = JSON.parse(localStorage.getItem('sb_review_words') || '[]');
        } catch (e) { reviewWords = []; }
      }
      let writingSample = '';
      if (dashboardMode === 'writing') {
        try { writingSample = localStorage.getItem('sb_writing_sample') || ''; } catch (e) {}
      }

      function authHeaders() {
        return { 'Authorization': 'Bearer ' + (localStorage.getItem('sb_token') || localStorage.getItem('knuut_token') || '') };
      }

      function clearAuthAndRedirectToLogin() {
        ['knuut_token', 'knuut_user', 'sb_token', 'sb_user'].forEach(function (k) { localStorage.removeItem(k); });
        location.replace('/login.html?next=' + encodeURIComponent('/knuut.html' + location.search));
      }

      function jwtPayload() {
        try {

          if (!t) return {};
          var p = t.split('.')[1];
          var json = atob(p.replace(/-/g, '+').replace(/_/g, '/'));
          return JSON.parse(json);
        } catch (e) { return {}; }

      function extractAllCards(text) {
        if (!text || typeof text !== 'string') return [];
        if (text.indexOf('[[END_CARD]]') === -1) return [];
        var re = /\[\[CARD\]\]([\s\S]*?)\[\[END_CARD\]\]/g;
        var cards = [];
        var m;
        while ((m = re.exec(text)) !== null) {
          var content = m[1];
          var word = (content.match(/word:\s*(.+?)(?:\n|$)/) || [])[1];
          var hint = (content.match(/translation_hint:\s*(.+?)(?:\n|$)/) || [])[1];
          var type = (content.match(/type:\s*(.+?)(?:\n|$)/) || [])[1];
          if (word) {
            word = word.trim();
            cards.push({
              word: word,
              translation_hint: hint ? hint.trim() : '',
              type: type ? type.trim() : 'word'
            });
          }
        }
        return cards;
      }

      function addCardsToQueue(cards) {
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          var exists = cardQueue.some(function(q) { return q.card.word === c.word; });
          if (!exists) cardQueue.push({ id: null, card: c });
        }
        showNextCardInQueue();
      }

      function showNextCardInQueue() {
        if (currentCardId) return;
        if (cardQueue.length === 0) return;
        var next = cardQueue.shift();
        var id = 'card-' + (++cardIdCounter);
        next.id = id;
        currentCardId = id;
        renderLearningCard(id, next.card);
      }

      function showLearningCard(card) {
        addCardsToQueue([card]);
      }

      function closeLearningCard(cardId) {
        var el = document.querySelector('[data-card-id="' + cardId + '"]');
        var word = el ? el.getAttribute('data-card-word') : null;
        currentCardId = null;
        var container = document.getElementById('learning-cards-container');
        if (container && el) el.remove();
        if (word) notifyCardClosed(word);
        showNextCardInQueue();
      }

      function notifyCardClosed(word) {

            }
          }));
          sendResponseCreate();
        } catch (e) { console.error('Notify card closed failed:', e); }

      function normalizeForCompare(s) {
        return (s || '').toLowerCase().replace(/\s+/g, ' ').trim();

      function renderLearningCard(id, card) {
        var container = document.getElementById('learning-cards-container');
        if (!container) return;
        var wrap = document.createElement('div');
        wrap.className = 'learning-card';
        wrap.setAttribute('data-card-id', id);

        var inner = wrap.querySelector('.learning-card-inner');
        var hintHtml = card.translation_hint
          ? '<div class="card-hint-wrap"><div class="card-hint" style="display:none">' + escapeHtml(card.translation_hint) + '</div><button type="button" class="btn-reveal">Reveal hint</button></div>'
          : '';
        inner.innerHTML = '<div class="card-header"><h3>New word</h3><button type="button" class="btn-repeat" title="Repeat after me">Repeat</button></div>' +
          '<div class="card-word">' + escapeHtml(card.word) + '</div>' +
          hintHtml +
          '<input type="text" placeholder="What does this mean?" data-card-input />' +
          '<div class="card-feedback" style="display:none"></div>' +
          '<div class="card-actions"><button class="btn-check">Check</button><button class="btn-save" style="display:none">Save</button><button class="btn-close">Close</button></div>';
        var input = inner.querySelector('input');
        var btnCheck = inner.querySelector('.btn-check');
        var btnSave = inner.querySelector('.btn-save');
        var btnClose = inner.querySelector('.btn-close');
        var btnRepeat = inner.querySelector('.btn-repeat');
        var feedbackEl = inner.querySelector('.card-feedback');
        var hintEl = inner.querySelector('.card-hint');
        var revealBtn = inner.querySelector('.btn-reveal');
        btnClose.onclick = function() { closeLearningCard(id); };
        if (btnRepeat) btnRepeat.onclick = function() { requestRepeat(card.word); };
        if (revealBtn && hintEl) {
          revealBtn.onclick = function() {
            if (hintEl.style.display === 'none') {
              hintEl.style.display = 'block';
              hintEl.style.marginTop = '6px';
              revealBtn.textContent = 'Hide hint';
            } else {
              hintEl.style.display = 'none';
              revealBtn.textContent = 'Reveal hint';
            }
          };
        }
        btnCheck.onclick = function() {
          var answer = input ? input.value.trim() : '';
          var hintNorm = normalizeForCompare(card.translation_hint);
          var ansNorm = normalizeForCompare(answer);
          var correct = hintNorm && ansNorm && (hintNorm.indexOf(ansNorm) !== -1 || ansNorm.indexOf(hintNorm) !== -1 || hintNorm === ansNorm);
          feedbackEl.style.display = 'block';
          if (correct) {
            feedbackEl.textContent = 'Correct!';
            feedbackEl.className = 'card-feedback feedback-correct';
          } else {
            feedbackEl.innerHTML = 'Answer: <strong>' + escapeHtml(card.translation_hint || 'N/A') + '</strong>';
            feedbackEl.className = 'card-feedback feedback-wrong';
          }
          requestCardFeedback(card.word, answer);
          btnCheck.style.display = 'none';
          btnSave.style.display = 'inline-block';
        };
        btnSave.onclick = function() {
          var answer = input ? input.value.trim() : '';
          var hintNorm = normalizeForCompare(card.translation_hint);
          var ansNorm = normalizeForCompare(answer);
          var correct = hintNorm && ansNorm && (hintNorm.indexOf(ansNorm) !== -1 || ansNorm.indexOf(hintNorm) !== -1 || hintNorm === ansNorm);
          saveCardToBrain({ word: card.word, answer: answer, translation_hint: card.translation_hint, type: card.type, correct: correct }, id);
        };
        container.appendChild(wrap);
      }

      function escapeHtml(s) {

      let ykiTimeLeft = 15 * 60;

      async function getSessionFocus() {

          const url = learnerId ? '/api/session-focus?learner_id=' + encodeURIComponent(learnerId) : '/api/session-focus';

          if (res.status === 401) {

          }
          const data = await res.json();
          return {
            fragment: data.system_prompt_fragment || '',
            focusTopics: (data.focus_topics || []).map(function(t) { return t.label || t; })
          };

      async function onSessionEnd() {
        const duration = Math.round((Date.now() - sessionStartTime) / 1000);
        if (sessionTranscript.length < 50) return;

        try {
          const body = {
            transcript: sessionTranscript,
            duration_s: duration,
            learner_language: 'fi',
            is_mock_exam: examMode,
            is_yki_exam: examMode
          };
          if (learnerId) body.learner_id = learnerId;

          const res = await fetch('/api/session-complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...authHeaders() },
            body: JSON.stringify(body)
          });
          const result = await res.json();
          console.log('Session saved:', result.summary);

          if (examMode) {
            let ykiResult = null;
            try {
              const scoreRes = await fetch('/api/yki-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...authHeaders() },
                body: JSON.stringify({ transcript: sessionTranscript, learner_id: learnerId, episode_id: result.episode_id })
              });
              ykiResult = await scoreRes.json();
            } catch (e) { console.error('YKI score failed:', e); }

            showSessionOverlay(true, result, ykiResult, duration);
          } else {
            showSessionOverlay(false, result, null, duration);
          }
          if (result.topics_updated || result.new_nodes_created) {
            console.log('Brain updated:', result.topics_updated, 'nodes,', result.new_nodes_created, 'new');
          }
        } catch (err) {
          console.error('Failed to save session:', err);
          showSessionOverlay(false, { summary: 'Error saving session' }, null, 0);
        }
        sessionTranscript = '';

      function showSessionOverlay(isYki, result, ykiScore, durationSecs) {
        const overlay = document.getElementById('session-overlay');
        const check = document.getElementById('overlay-check');
        const title = document.getElementById('overlay-title');
        const stats = document.getElementById('overlay-stats');
        const summary = document.getElementById('overlay-summary');

        overlay.classList.add('visible');
        const close = () => overlay.classList.remove('visible');
        const esc = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } };
        document.addEventListener('keydown', esc);
        overlay.onclick = (e) => { if (e.target === overlay) close(); };
        if (isYki && ykiScore) {
          const passed = (ykiScore.yki_result || '').includes('pass') && !(ykiScore.yki_result || '').includes('fail');
          title.textContent = 'Exam complete! Your result: ' + (passed ? 'PASS' : 'FAIL');
          stats.innerHTML = '';
          summary.textContent = result.summary || '';
          summary.style.display = 'block';
          buttons.innerHTML = `
            <a href="/yki-results.html?episode=${result.episode_id}" class="btn btn-primary">See full report</a>
            <a href="/knuut.html" class="btn btn-success">Practice weak areas</a>
          `;
        } else {
          title.textContent = 'Session complete!';
          const m = Math.floor((durationSecs || result.duration_s || 0) / 60);
          const s = (durationSecs || result.duration_s || 0) % 60;
          stats.innerHTML = `
            <span class="overlay-stat">⏱ ${m}m ${s}s</span>
            <span class="overlay-stat">🧠 ${result.topics_updated || 0} topics practiced</span>
            <span class="overlay-stat">✨ ${result.new_nodes_created || 0} new topics</span>
          `;
          stats.style.display = 'flex';
          summary.textContent = result.summary || '';
          summary.style.display = 'block';
          buttons.innerHTML = `
            <a href="/knuut.html" class="btn btn-primary">Practice again</a>
            <a href="/oppipolku.html" class="btn btn-success">Oppipolku</a>
          `;
        }
      }

      function updateStatus(text, isActive = false) {

      async function startKnuut(){
        if (isActive || isStarting) return;
        deactivateTextFallback();
        examMode = document.querySelector('.mode-tab[data-mode="yki"]')?.classList.contains('active');
        document.body.classList.toggle('yki-mode', examMode);
        document.getElementById('yki-banner').classList.toggle('visible', examMode);
        ykiTimeLeft = 15 * 60;
        updateTimerDisplay(ykiTimeLeft);
        isStarting = true;
        btn.disabled = true;
        updateStatus(examMode ? 'Connecting (YKI exam mode)...' : 'Connecting...');

        try {
          sdpAnswerApplied = false;
          dataChannelOpen = false;
          realtimeConversationKicked = false;
          sessionClientInstructionUpdateSent = false;
          // Unlock AudioContext while still in the click gesture (Safari / strict autoplay).
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
              const u = new AC();
              if (u.state === 'suspended') await u.resume();
              u.close();
            }
          } catch (eUnlock) {}

          await ensureRtcHints();
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          updateStatus('Microphone connected');

          pc = new RTCPeerConnection({
            iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
          });

          if (!remoteAudioEl) {
            remoteAudioEl = document.createElement('audio');
            remoteAudioEl.autoplay = true;
            remoteAudioEl.playsInline = true;
            remoteAudioEl.setAttribute('playsinline', '');
            remoteAudioEl.setAttribute('webkit-playsinline', '');
            remoteAudioEl.muted = false;
            remoteAudioEl.volume = 1;
            document.body.appendChild(remoteAudioEl);
          }

          pc.ontrack = async function (event) {
            var stream = event.streams && event.streams[0];
            if (!stream && event.track) stream = new MediaStream([event.track]);
            if (!stream) return;
            remoteAudioEl.srcObject = stream;
            remoteAudioEl.muted = false;
            remoteAudioEl.volume = 1;
            try {
              await remoteAudioEl.play();
              updateStatus('Listening...', true);
            } catch (ePlay) {
              console.warn('[Knuut] Remote audio play():', ePlay && ePlay.message);
              showToast('If you hear nothing: unmute the tab and allow sound for this site.');
            }
            try {
              const bars = document.querySelectorAll('#voice-bars .vb');
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!remoteAnalyserCtx) remoteAnalyserCtx = new AC();
              if (remoteAnalyserCtx.state === 'suspended') await remoteAnalyserCtx.resume();
              const src2 = remoteAnalyserCtx.createMediaStreamSource(stream);
              const analyser2 = remoteAnalyserCtx.createAnalyser();
              analyser2.fftSize = 256;
              src2.connect(analyser2);
              const buf2 = new Uint8Array(analyser2.frequencyBinCount);
              const tick2 = () => {
                analyser2.getByteFrequencyData(buf2);
                const level2 = buf2.reduce((a, b) => a + b, 0) / (buf2.length * 255);
                bars.forEach((el, i) => {
                  const scale = 0.5 + Math.min(1, level2 * 5) * (0.9 + 0.5 * Math.cos((Date.now() / 100) + i));
                  el.style.transform = 'scaleY(' + scale.toFixed(2) + ')';
                  el.style.transformOrigin = 'bottom';
                  el.style.opacity = (0.8 + level2 * 0.2).toFixed(2);
                });
                requestAnimationFrame(tick2);
              };
              tick2();
            } catch (eAn) { console.warn('[Knuut] remote analyser:', eAn); }
          };

          pc.oniceconnectionstatechange = () => {
            if (pc.iceConnectionState === 'connected') updateStatus('Connected', true);
          };

          micStream.getTracks().forEach(function (t) {
            t.enabled = true;
            pc.addTrack(t, micStream);
          });

          try {
            const bars = document.querySelectorAll('#voice-bars .vb');
            if (micAnalyserCtx) { try { micAnalyserCtx.close(); } catch (e) {} micAnalyserCtx = null; }
            micAnalyserCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (micAnalyserCtx.state === 'suspended') await micAnalyserCtx.resume();
            const src = micAnalyserCtx.createMediaStreamSource(micStream);
            const analyser = micAnalyserCtx.createAnalyser();
            analyser.fftSize = 256;
            src.connect(analyser);
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              analyser.getByteFrequencyData(buf);
              const level = buf.reduce((a, b) => a + b, 0) / (buf.length * 255);
              bars.forEach((el, i) => {
                const scale = 0.4 + Math.min(1, level * 4) * (0.6 + 0.4 * Math.sin((Date.now() / 120) + i));
                el.style.transform = 'scaleY(' + scale.toFixed(2) + ')';
                el.style.transformOrigin = 'bottom';
                el.style.opacity = (0.7 + level * 0.3).toFixed(2);
              });
              requestAnimationFrame(tick);
            };
            tick();
          } catch (eMic) { console.warn('[Knuut] mic analyser:', eMic); }

          sessionTranscript = '';
          sessionStartTime = Date.now();
          cardQueue = [];
          currentCardId = null;
          knuutTranscriptBuffer = '';
          var cc = document.getElementById('learning-cards-container');
          if (cc) cc.innerHTML = '';

          sessionInstructions = '';
          baseSessionInstructions = '';
          oaiChannel = pc.createDataChannel(rtcHints.dataChannelLabel);
          const channel = oaiChannel;
          channel.onerror = function(ev) {
            console.warn('[Knuut] data channel error', ev);
          };
          channel.onopen = function() {
            dataChannelOpen = true;
            sendSessionInstructionsClientUpdate();
            tryKickConversation();
          };
          channel.onmessage = function(event) {
            try {
              const obj = JSON.parse(event.data || '{}');
              if (obj.type === 'session.error' && obj.error) {
                console.warn('[Knuut realtime] session.error', obj.error);
                if (obj.error.message) showToast(String(obj.error.message).slice(0, 140));
              } else if (obj.error) {
                console.warn('[Knuut realtime]', obj);
                if (obj.error.message) showToast(String(obj.error.message).slice(0, 140));
              }
              const t = obj.transcript || obj.item?.transcript;
              if (obj.type === 'response.output_audio_transcript.done' && t) {
                sessionTranscript += '\n[Knuut]: ' + t;
                checkTranscriptForCards(t);
              }
              if (obj.type === 'response.output_text.delta' && obj.delta) {
                knuutTranscriptBuffer += obj.delta;
                if (knuutTranscriptBuffer.length > 10000) knuutTranscriptBuffer = knuutTranscriptBuffer.slice(-8000);
                var cards = extractAllCards(knuutTranscriptBuffer);
                if (cards.length > 0) addCardsToQueue(cards);
              }
              if (obj.type === 'response.output_item.done' && obj.item?.content) {
                var textParts = [];
                var parts = obj.item.content || [];
                for (var i = 0; i < parts.length; i++) {
                  var p = parts[i];
                  if (p && (p.text || p.transcript)) textParts.push(p.text || p.transcript || '');
                }
                var fullText = textParts.join('');
                if (fullText) {
                  sessionTranscript += '\n[Knuut]: ' + fullText;
                  checkTranscriptForCards(fullText);
                }
              }
              if (obj.type === 'conversation.item.input_audio_transcription.completed' && t) {
                sessionTranscript += '\n[Learner]: ' + t;
              }
            } catch (e) {}
          };

          const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: false });
          await pc.setLocalDescription(offer);

          const focusData = await getSessionFocus();
          let focusTopics = focusData.focusTopics || [];
          if ((dashboardMode === 'writing' || dashboardMode === 'learn') && topicParam) {
            const decodedTopic = decodeURIComponent(topicParam);
            focusTopics = [decodedTopic].concat(focusTopics.filter(function(t) { return t !== decodedTopic; })).slice(0, 5);
          }
          const sessionBody = {
            sdp: offer.sdp || '',
            learner_id: learnerId || undefined,
            mode: examMode ? 'yki' : 'regular',
            dashboard_mode: dashboardMode || undefined,
            focusTopics: focusTopics,
            topic: topicParam ? decodeURIComponent(topicParam) : undefined,
            review_words: reviewWords.length > 0 ? reviewWords : undefined,
            writing_sample: writingSample || undefined,
            oph_module: ophModuleParam || undefined,
            workplace_prep: workplacePrepParam || undefined
          };
          try {
            const resp = await fetch(SERVER_URL + '/api/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...authHeaders() },
              body: JSON.stringify(sessionBody)
            });

            if (!resp.ok) {
              if (resp.status === 401) {
                try { if (pc) pc.close(); } catch (e401) {}
                pc = null;
                oaiChannel = null;
                if (micStream) {
                  micStream.getTracks().forEach(function(t) { t.stop(); });
                  micStream = null;
                }
                if (micAnalyserCtx) { try { micAnalyserCtx.close(); } catch (e) {} micAnalyserCtx = null; }
                if (remoteAnalyserCtx) { try { remoteAnalyserCtx.close(); } catch (e) {} remoteAnalyserCtx = null; }
                clearAuthAndRedirectToLogin();
                return;
              }
              const errRaw = await resp.text();
              var errMsg = errRaw;
              try {
                var ej = JSON.parse(errRaw);
                errMsg = ej.error || ej.code || errRaw;
              } catch (e1) {}
              throw new Error(errMsg);
            }

            const data = await resp.json();
            if (data.voice_provider === 'openai') {
              rtcHints.provider = data.voice_provider;
            }
            voiceSessionCapSec = (typeof data.remaining_seconds === 'number' && data.remaining_seconds >= 0)
              ? data.remaining_seconds
              : (30 * 60);
            const answerSdp = typeof data.answer === 'string' ? data.answer : (data.sdp || '');
            baseSessionInstructions = data.instructions || '';
            sessionInstructions = baseSessionInstructions;
            await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
            sdpAnswerApplied = true;
            sendSessionInstructionsClientUpdate();
            tryKickConversation();
            if (remoteAudioEl && remoteAudioEl.srcObject) {
              try { await remoteAudioEl.play(); } catch (ePlay2) { console.warn('[Knuut] play after SDP:', ePlay2); }
            }
          } catch (sessionErr) {
            console.error(sessionErr);
            document.getElementById('yki-banner').classList.remove('visible');
            document.body.classList.remove('yki-mode');
            try { if (pc) pc.close(); } catch (e2) {}
            pc = null;
            oaiChannel = null;
            if (micStream) {
              micStream.getTracks().forEach(function(t) { t.stop(); });
              micStream = null;
            }
            if (micAnalyserCtx) { try { micAnalyserCtx.close(); } catch (e) {} micAnalyserCtx = null; }
            if (remoteAnalyserCtx) { try { remoteAnalyserCtx.close(); } catch (e) {} remoteAnalyserCtx = null; }
            if (remoteAudioEl) remoteAudioEl.srcObject = null;
            document.querySelectorAll('#voice-bars .vb').forEach(function(el) {
              el.style.transform = 'scaleY(1)';
              el.style.opacity = '0.5';
            });
            activateTextChatFallback(sessionErr);
            return;
          }

          isActive = true;
          btn.textContent = 'Stop Knuut';
          btn.classList.add('active');
          var pbtn = document.getElementById('knuut-panic-btn');
          if (pbtn) pbtn.style.display = 'inline-block';
          updateStatus('Ready to talk', true);

          if (voiceCapCheckInterval) {
            clearInterval(voiceCapCheckInterval);
            voiceCapCheckInterval = null;
          }
          voiceCapCheckInterval = setInterval(function() {
            if (!isActive) return;
            var elapsed = Math.round((Date.now() - sessionStartTime) / 1000);
            if (elapsed >= voiceSessionCapSec) {
              if (voiceCapCheckInterval) {
                clearInterval(voiceCapCheckInterval);
                voiceCapCheckInterval = null;
              }
              showToast('Päivän puheajan enimmäisaika täynnä · Daily voice limit reached', 'warning');
              stopKnuut();
            }
          }, 3000);

          if (examMode) {
            ykiTimeLeft = Math.min(15 * 60, voiceSessionCapSec);
            updateTimerDisplay(ykiTimeLeft);
            ykiTimerInterval = setInterval(() => {
              ykiTimeLeft--;
              updateTimerDisplay(ykiTimeLeft);
              if (ykiTimeLeft === 120) showToast('2 minutes remaining', 'warning');
              if (ykiTimeLeft <= 0) {
                clearInterval(ykiTimerInterval);
                ykiTimerInterval = null;
                stopKnuut();
              }
            }, 1000);
          }
        } catch (e) {
          console.error(e);
          stopKnuut();
          updateStatus('Error: ' + (e && e.message ? e.message : 'Unknown'));
          alert('Could not start: ' + (e && e.message ? e.message : e));
        } finally {
          isStarting = false;
          btn.disabled = false;
        }
      }

      function stopKnuut(){
        if (voiceCapCheckInterval) { clearInterval(voiceCapCheckInterval); voiceCapCheckInterval = null; }
        if (ykiTimerInterval) { clearInterval(ykiTimerInterval); ykiTimerInterval = null; }
        document.getElementById('yki-banner').classList.remove('visible');
        document.body.classList.remove('yki-mode');
        onSessionEnd();
        isActive = false;
        btn.textContent = 'Talk with Knuut';
        btn.classList.remove('active');
        var pbtn2 = document.getElementById('knuut-panic-btn');
        if (pbtn2) pbtn2.style.display = 'none';
        updateStatus('');
        try { if (pc) pc.close(); } catch {}
        pc = null;
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
        if (remoteAudioEl) remoteAudioEl.srcObject = null;
        if (micAnalyserCtx) { try { micAnalyserCtx.close(); } catch (e) {} micAnalyserCtx = null; }
        if (remoteAnalyserCtx) { try { remoteAnalyserCtx.close(); } catch (e) {} remoteAnalyserCtx = null; }
        document.querySelectorAll('#voice-bars .vb').forEach(el => {
          el.style.transform = 'scaleY(1)';
          el.style.opacity = '0.5';
        });
      }

      function panicHelpAppendix(mt) {
        var label = (mt && String(mt).trim()) ? String(mt).trim() : 'the learner\'s mother tongue (not Finnish)';
        return '\n\nPANIC / HELP BUTTON ACTIVATED.\nThe learner felt lost or anxious during Finnish practice.\nFor your NEXT spoken response ONLY:\n1) Speak ONLY in ' + label + '.\n2) In very simple words, explain what you were practicing in Finnish just now.\n3) Reassure them — this is difficult for everyone at first.\n4) Offer: hear one Finnish sentence again slowly, OR continue with one short phrase together.\nKeep under about one minute of speaking. Then return to normal bilingual teaching rules.\n';
      }

      var panicBtn = document.getElementById('knuut-panic-btn');
      if (panicBtn) {
        panicBtn.addEventListener('click', function (ev) {
          ev.preventDefault();
          if (!oaiChannel || oaiChannel.readyState !== 'open' || !baseSessionInstructions) return;
          var mt = (user && user.mother_tongue) || '';
          try {
            var panicSession = { instructions: baseSessionInstructions + panicHelpAppendix(mt), voice: 'verse' };
            oaiChannel.send(JSON.stringify({ type: 'session.update', session: panicSession }));
            sendResponseCreate();
            updateStatus('Help — explaining in your language…', true);
          } catch (err) { console.error(err); }
        });
      }

      btn.addEventListener('click', function(ev){
        ev.preventDefault();
        if (isActive) stopKnuut(); else startKnuut();
      });
    })();
  </script>

  <script>
    (function() {
      var useRef = React.useRef, useEffect = React.useEffect;
      function Orb(props) {
        var hue = props.hue || 260;
        var containerRef = useRef(null);
        useEffect(function() {
          var container = containerRef.current;
          if (!container) return;
          var canvas = document.createElement('canvas');
          canvas.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0;opacity:0.5';
          container.appendChild(canvas);
          var ctx = canvas.getContext('2d');
          var t = 0, raf;
          function resize() { canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; }
          function animate() {
            t += 0.01;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            var cx = canvas.width/2, cy = canvas.height/2, r = Math.min(canvas.width,canvas.height)*0.4;
            var g = ctx.createRadialGradient(cx+Math.sin(t)*40, cy+Math.cos(t)*40, 0, cx, cy, r);
            var h = (hue + t*15) % 360;
            g.addColorStop(0, 'hsla('+h+',70%,60%,0.7)');
            g.addColorStop(0.5, 'hsla('+(h+20)+',70%,50%,0.35)');
            g.addColorStop(1, 'hsla('+(h+40)+',70%,40%,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI*2);
            ctx.fill();
            raf = requestAnimationFrame(animate);
          }
          resize();
          animate();
          window.addEventListener('resize', resize);
          return function() { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
        }, [hue]);
        return React.createElement('div', { ref: containerRef, style: {width:'100%',height:'100%',position:'relative'} });
      }
      var root = ReactDOM.createRoot(document.getElementById('orb-root'));
      root.render(React.createElement(Orb, { hue: 260 }));
    })();
  </script>
  <script src="vendor/shepherd.min.js"></script>
  <script src="tour.js"></script>
  <script>
    if (window.AlkuTour) AlkuTour.initKnuut();
  </script>
